<!DOCTYPE html>
<html lang="en">
  <head>
    <script>try{var t=localStorage.getItem("xadmin_theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="XMARKET admin console" />
    <meta name="apple-mobile-web-app-title" content="XADMIN" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <title>XADMIN · XMARKET Console</title>
  <script>
function showErr(m){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;inset:0;z-index:99999;background:#fff;color:#b00020;padding:16px;white-space:pre-wrap;font:13px monospace">'+m+'</pre>')}
addEventListener('error',function(e){showErr(e.message)});
addEventListener('unhandledrejection',function(e){showErr(String(e.reason))});
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
